include:
  - project: 'devsecops/gitlab-ci-common'
    ref: master
    file: '/template/build_and_sign.yml'

release_build_and_sign:
  stage: build
  extends: .build_and_sign
  before_script:
    - echo "takrepo.url=https://artifacts.tak.gov/artifactory/maven" >> local.properties
    - !reference [.build_and_sign, before_script]
  variables:
    variants: "civ"
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
