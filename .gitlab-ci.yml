include:
  - project: 'devsecops/gitlab-ci-common'
    ref: master
    file: '/template/build_and_sign.yml'

field_report_regressions:
  stage: test
  image:
    name: ${TAK_REGISTRY_HOST}/devsecops/gradle-build-launcher:17-${GRADLE_BUILD_LAUNCHER_TAG}
    entrypoint: [""]
  script:
    - |
      set -euo pipefail
      mkdir -p .regression-libs .regression-classes
      base=https://repo.maven.apache.org/maven2
      curl --fail --silent --show-error --retry 3 "$base/junit/junit/4.13.2/junit-4.13.2.jar" -o .regression-libs/junit.jar
      curl --fail --silent --show-error --retry 3 "$base/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar" -o .regression-libs/hamcrest.jar
      curl --fail --silent --show-error --retry 3 "$base/org/json/json/20231013/json-20231013.jar" -o .regression-libs/json.jar
      main=app/src/main/java/com/weartak/atak/weartak_companion/plugin
      tests=app/src/test/java/com/weartak/atak/weartak_companion/plugin
      javac -cp '.regression-libs/*' -d .regression-classes \
        "$main/PhoneFixValidator.java" "$main/PhonePosition.java" \
        "$main/PhonePositionActions.java" "$main/WatchMessageIds.java" \
        "$main/LegacyPliCot.java" \
        "$main/PhoneMarkerRelay.java" "$main/PhoneUserRelay.java" \
        "$main/PhoneRouteNavigationRelay.java" \
        "$main/RouteNavigationControl.java" "$main/RouteNavigationCot.java" \
        "$main/RouteNavigationTransport.java" "$main/GarminRouteNavigationTransport.java" \
        "$main/GarminRouteProtocol.java" "$main/GarminRouteForwarder.java" \
        "$main/SourceCotTiming.java" \
        "$main/GarminEntityAdapter.java" "$main/GarminEntityForwarder.java" \
        "$main/ConnectionModeController.java" \
        "$main/AtakUnitPreferences.java" "$main/SettingsPayloadBuilder.java" "$main/TakServerItem.java" \
        "$tests/AtakUnitPreferencesTest.java" "$tests/SettingsPayloadBuilderTest.java" \
        "$tests/PhonePositionActionsTest.java" "$tests/WatchMessageIdsTest.java" \
        "$tests/LegacyPliCotTest.java" \
        "$tests/PhoneMarkerRelayTest.java" "$tests/PhoneUserLifetimeWarningsTest.java" \
        "$tests/PhoneRouteNavigationRelayTest.java" \
        "$tests/RouteNavigationControlTest.java" "$tests/RouteNavigationCotTest.java" \
        "$tests/GarminRouteNavigationTransportTest.java" \
        "$tests/GarminRouteProtocolTest.java" "$tests/GarminRouteForwarderTest.java" \
        "$tests/SourceCotTimingTest.java" \
        "$tests/GarminEntityAdapterTest.java" "$tests/GarminEntityForwarderTest.java"
      java -cp '.regression-classes:.regression-libs/*' org.junit.runner.JUnitCore \
        com.weartak.atak.weartak_companion.plugin.AtakUnitPreferencesTest \
        com.weartak.atak.weartak_companion.plugin.SettingsPayloadBuilderTest \
        com.weartak.atak.weartak_companion.plugin.PhonePositionActionsTest \
        com.weartak.atak.weartak_companion.plugin.WatchMessageIdsTest \
        com.weartak.atak.weartak_companion.plugin.LegacyPliCotTest \
        com.weartak.atak.weartak_companion.plugin.PhoneMarkerRelayTest \
        com.weartak.atak.weartak_companion.plugin.PhoneRouteNavigationRelayTest \
        com.weartak.atak.weartak_companion.plugin.RouteNavigationControlTest \
        com.weartak.atak.weartak_companion.plugin.RouteNavigationCotTest \
        com.weartak.atak.weartak_companion.plugin.GarminRouteNavigationTransportTest \
        com.weartak.atak.weartak_companion.plugin.GarminRouteProtocolTest \
        com.weartak.atak.weartak_companion.plugin.GarminRouteForwarderTest \
        com.weartak.atak.weartak_companion.plugin.PhoneUserLifetimeWarningsTest \
        com.weartak.atak.weartak_companion.plugin.SourceCotTimingTest \
        com.weartak.atak.weartak_companion.plugin.GarminEntityAdapterTest \
        com.weartak.atak.weartak_companion.plugin.GarminEntityForwarderTest | tee field-report-regressions.log
  artifacts:
    when: always
    paths:
      - field-report-regressions.log
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

release_build_and_sign:
  stage: build
  extends: .build_and_sign_jdk17
  before_script:
    - |
      case "${CI_DEBUG_TRACE:-false}" in
        true|TRUE|1)
          echo "ERROR: Disable CI_DEBUG_TRACE before running authenticated probes"
          exit 1
          ;;
      esac
    - !reference [.build_and_sign_jdk17, before_script]
    - |
      set +x
      if [ -z "${CI_JOB_ARTIFACTORY_TOKEN:-}" ]; then
        echo "ERROR: Artifactory token was not created"
        exit 1
      fi

      probe() {
        label="$1"
        url="$2"
        if code=$(printf 'header = "Authorization: Bearer %s"\n' \
          "$CI_JOB_ARTIFACTORY_TOKEN" |
          curl --config - --silent --show-error \
            --connect-timeout 15 --max-time 45 \
            --output /dev/null --write-out '%{http_code}' "$url"); then
          printf '%s: HTTP %s\n' "$label" "$code"
        else
          printf 'ERROR: %s request failed\n' "$label"
          return 1
        fi
      }

      probe 'TAK plugin / maven-release' \
        'https://artifacts.tak.gov/artifactory/maven-release/com/atakmap/gradle/atak-gradle-takdev/maven-metadata.xml'
      probe 'TAK plugin / maven' \
        'https://artifacts.tak.gov/artifactory/maven/com/atakmap/gradle/atak-gradle-takdev/maven-metadata.xml'
      probe 'TAK plugin / maven-tooling-local' \
        'https://artifacts.tak.gov/artifactory/maven-tooling-local/com/atakmap/gradle/atak-gradle-takdev/maven-metadata.xml'
      probe 'NVD metadata / CI token' \
        'https://artifacts.tak.gov/artifactory/nvdcve/nvdcve-modified.meta'
  variables:
    variants: "civ"
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'

publish_github_rolling_release:
  stage: .post
  image:
    name: ${TAK_REGISTRY_HOST}/devsecops/gradle-build-launcher:17-${GRADLE_BUILD_LAUNCHER_TAG}
    entrypoint: [""]
  needs:
    - job: release_build_and_sign
      artifacts: true
  resource_group: weartak-companion-github-rolling-release
  variables:
    GITHUB_REPOSITORY: Ascent-Integrated-Tech/atak-plugin-weartak-companion
  before_script:
    - |
      case "${CI_DEBUG_TRACE:-false}" in
        true|TRUE|1)
          echo "ERROR: Disable CI_DEBUG_TRACE before publishing authenticated releases"
          exit 1
          ;;
      esac
  script:
    - python3 scripts/publish_github_release.py
  rules:
    - if: '$CI_SERVER_HOST == "git.tak.gov" && $CI_PROJECT_PATH == "aegorsuch/atak-plugin-weartak-companion" && $CI_COMMIT_BRANCH == "develop" && $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_PROTECTED == "true"'
